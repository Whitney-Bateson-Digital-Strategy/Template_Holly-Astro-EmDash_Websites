
name: Cloudflare Preview

on:
  push:
    branches:
      - cloudflare-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro for Cloudflare Preview
        run: npm run build
        env:
          CLOUDFLARE_ENV: preview

      - name: Verify preview bindings
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/emdash-preview-check

      - name: Check credential formatting
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 -c 'import os; t=os.getenv("CF_TOKEN",""); a=os.getenv("CF_ACCOUNT",""); print("Token present:",bool(t)); print("Token whitespace:",any(c.isspace() for c in t)); print("Account present:",bool(a)); print("Account whitespace:",any(c.isspace() for c in a)); print("Account length valid:",len(a)==32)'

      - name: Deploy preview to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

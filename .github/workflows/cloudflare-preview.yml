
name: Cloudflare Preview

on:
  push:
    branches:
      - cloudflare-preview

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro + EmDash
        run: npm run build

              CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os

          for name in ("CF_TOKEN", "CF_ACCOUNT"):
              value = os.environ.get(name, "")
              print(f"{name}:")
              print(f"  Present: {bool(value)}")
              print(f"  Has spaces: {' ' in value}")
              print(f"  Has newline: {chr(10) in value or chr(13) in value}")
          PY  print(f"  Contains Bearer prefix: {value.startswith('Bearer ')}")
bash: -: command not found
bash: env:: command not found
bash: ${{ secrets.CLOUDFLARE_API_TOKEN }}: bad substitution
bash: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}: bad substitution

      - name: Deploy preview to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview

